# Read by src/abms/orchestrator.py. The guardrail bounds below are also
# constants in guardrails.py, which is where the code reads them from; they
# are repeated here for reference only.

building_idf: models/building.idf
weather_file: models/weather/USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.epw

# How often controllers are consulted, in simulation minutes. The model
# runs 4 timesteps an hour, so 15 minutes is one timestep.
decision_interval_minutes:
  rulebased: 15
  llm: 60

# Rule-based setpoints in C. Deeper than the IDF's own 18.0/27.0 setback,
# and driven by real occupancy rather than a static 6:00-20:00 window. The
# occupancy schedule actually runs about 8:00-19:00, so this avoids
# conditioning an empty building at the edges of the day.
rulebased_controller:
  occupied_heat_c: 21.0
  occupied_cool_c: 24.0
  unoccupied_heat_c: 18.3
  unoccupied_cool_c: 28.0

# Mirrored as constants in guardrails.py.
guardrails:
  heating_min_c: 12.0
  heating_max_c: 23.0
  cooling_min_c: 22.0
  cooling_max_c: 32.0
  min_deadband_c: 1.0
  max_step_c: 3.0
  occupied_heat_floor_c: 20.0
  occupied_cool_ceiling_c: 26.0

# Same numbers as the guardrail floor and ceiling, deliberately: that floor
# is the comfort promise, so metrics should measure against it.
comfort_band:
  occupied_heat_min_c: 20.0
  occupied_cool_max_c: 26.0

# Measured, not guessed: baseline january_week peaks near 0.42 kW and
# july_week near 0.64 kW, so this is 80% of the higher one, rounded.
peak_demand_kw_threshold: 0.5

# model and host can be overridden by OLLAMA_MODEL and OLLAMA_HOST.
llm_agent:
  model: qwen2.5:3b-instruct
  host: http://localhost:11434
  temperature: 0.2
  # A full prompt takes about 17-26s on this machine. The margin is
  # generous so a slow decision falls back cleanly instead of hanging.
  request_timeout_s: 45
  keep_alive: "10m"
  max_repair_retries: 1
  history_hours: 6
  # structured prefetches state and asks for one JSON decision, and is what
  # the demo and extended runs used. native lets the model drive its own
  # tool calls. Override with --mode.
  mode: structured

# At roughly 5-10s per decision, an annual run would take hours, so the
# default is two contrasting weeks. It lives here rather than in
# orchestrator.py so a longer run is a config edit. Each period patches the
# IDF's RunPeriod instead of needing its own committed copy.
demo_periods:
  - label: january_week
    begin_month: 1
    begin_day: 14
    end_month: 1
    end_day: 20
  - label: july_week
    begin_month: 7
    begin_day: 14
    end_month: 7
    end_day: 20

run_mode: baseline
